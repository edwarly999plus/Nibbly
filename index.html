<script>(function(){
try{
if('serviceWorker'in navigator){
navigator.serviceWorker.getRegistrations()
.then(function(regs){
if(regs.length){
regs.forEach(function(r){
try{r.unregister();}catch(_){}
});
console.info('[Nibbly] 🧹 Old SW unregistered:',regs.length);
}
})
.catch(function(){});
}
}catch(_){}
try{
if('caches'in window){
caches.keys().then(function(keys){
keys.filter(function(k){
return k.indexOf('nibbly')===0||k.indexOf('nib-')===0;
}).forEach(function(k){caches.delete(k);});
}).catch(function(){});
}
}catch(_){}
})();</script>
<style>:root{--bg-base:#0b1020;--bg-error:#22080e;
--accent-base:#5b8cff;--accent-error:#ff6b7a;

--bg:var(--bg-base);
--accent:var(--accent-base);

--on-surface:#f0f2f8;--on-variant:#a0a8c0;
--outline:rgba(255,255,255,.15);--bad:#ff6b7a;
--warn:#ffb020;--good:#22d3a6}
html{background:var(--bg)}
html.error-state{--accent:var(--accent-error);
--bg:var(--bg-error)}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{background:var(--bg);color:var(--on-surface);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
-webkit-font-smoothing:antialiased;
display:flex;align-items:center;justify-content:center;padding:24px;
transition:background-color .8s ease,color .8s ease}
.nibbly-shell{max-width:720px;width:100%;text-align:center;position:relative;
transition:max-width .3s ease}


.nibbly-title{font-size:clamp(42px,5.5vw,68px);
font-weight:800;letter-spacing:-1.2px;margin:0 0 6px;
line-height:1.05;
background:linear-gradient(135deg,
color-mix(in srgb,var(--accent) 60%,white),
color-mix(in srgb,var(--accent) 40%,#a78bfa));
-webkit-background-clip:text;background-clip:text;
color:transparent;-webkit-text-fill-color:transparent;
transition:opacity .8s ease,transform .8s ease}
.nibbly-title .dot{display:inline-block;width:16px;height:16px;border-radius:5px;
background:linear-gradient(135deg,
color-mix(in srgb,var(--accent) 80%,white),
color-mix(in srgb,var(--accent) 50%,#a78bfa));
vertical-align:middle;margin-right:10px;transform:translateY(-4px);
transition:background .8s ease,box-shadow .8s ease;
box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.nibbly-subtitle{color:var(--on-variant);
font-size:clamp(13.5px,1.6vw,18px);
margin:0 0 28px;letter-spacing:.3px;
transition:opacity .8s ease}
.nibbly-loading{color:var(--on-variant);
font-size:clamp(14px,1.7vw,20px);
font-weight:600;
padding:22px;white-space:pre-line;line-height:1.6;
transition:opacity .8s ease}
.nibbly-loading::after{content:'';display:inline-block;
width:clamp(12px,1.4vw,18px);
height:clamp(12px,1.4vw,18px);
margin-left:10px;border:2px solid var(--outline);
border-top-color:var(--accent);border-radius:50%;
animation:nib-spin .8s linear infinite;vertical-align:middle;
transition:border-color .8s ease}
@keyframes nib-spin{to{transform:rotate(360deg)}}


.boom-btn{position:fixed;
top:max(12px,env(safe-area-inset-top));
right:max(12px,env(safe-area-inset-right));
width:36px;
height:36px;
padding:0;
border-radius:50%;
border:1.5px solid color-mix(in srgb,var(--bad) 60%,transparent);
background:color-mix(in srgb,var(--bad) 14%,transparent);
color:var(--bad);
font-family:inherit;
font-size:17px;
line-height:1;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:background .18s,color .18s,transform .12s,opacity .3s,box-shadow .18s;
user-select:none;
z-index:9999}
.boom-btn:hover{background:color-mix(in srgb,var(--bad) 32%,transparent);
box-shadow:0 0 12px color-mix(in srgb,var(--bad) 40%,transparent)}
.boom-btn:active{transform:scale(.88)}
.boom-btn.hidden{opacity:0;
pointer-events:none;
transform:scale(.6)}


.boom-btn .nib-vec-icon{display:block;
margin:0;
transform:none;
pointer-events:none;
width:22px;
height:22px;
object-fit:contain}

.boom-btn.icon-ready .nib-vec-icon{filter:none;
opacity:.55}

.nibbly-error{display:none;margin-top:22px;padding:20px;border-radius:14px;
border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);
background:color-mix(in srgb,var(--bad) 10%,transparent);
color:var(--bad);
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
font-size:14px;line-height:1.65;text-align:left;

.nibbly-error.show{display:block}
.nibbly-error .code-tag{display:inline-block;padding:2px 9px;border-radius:999px;

.nibbly-error .error-detail{display:block;margin-top:12px;

.nibbly-error .error-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rescan-btn,.copy-error-btn,.wipe-cache-btn{display:inline-flex;align-items:center;gap:6px;
padding:11px 22px;border-radius:999px;
font-family:inherit;font-size:13px;font-weight:800;
cursor:pointer;letter-spacing:.4px;
transition:background .18s,color .18s,transform .12s;
border:1.5px solid}
.rescan-btn{border-color:var(--accent);background:transparent;color:var(--accent)}
.rescan-btn:hover:not(:disabled){background:var(--accent);color:#fff}
.rescan-btn:active:not(:disabled){transform:scale(.96)}
.rescan-btn:disabled{opacity:.5;cursor:wait;filter:grayscale(.4)}
.copy-error-btn{border-color:var(--bad);background:transparent;color:var(--bad)}
.copy-error-btn:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 20%,transparent)}
.copy-error-btn:active:not(:disabled){transform:scale(.96)}
.copy-error-btn.copied{background:color-mix(in srgb,var(--good) 20%,transparent);
border-color:var(--good);
color:var(--good)}
.wipe-cache-btn{border-color:var(--warn);background:transparent;color:var(--warn)}
.wipe-cache-btn:hover:not(:disabled){background:color-mix(in srgb,var(--warn) 20%,transparent)}
.wipe-cache-btn:active:not(:disabled){transform:scale(.96)}
.wipe-cache-btn:disabled{opacity:.5;cursor:wait;filter:grayscale(.4)}
.wipe-cache-btn.done{background:color-mix(in srgb,var(--good) 20%,transparent);
border-color:var(--good);
color:var(--good)}
.wipe-cache-btn .nib-vec-icon,
.copy-error-btn .nib-vec-icon,
.rescan-btn .nib-vec-icon{width:16px;
height:16px;
object-fit:contain}

.nibbly-shell.loading-fadeout .nibbly-title{opacity:0;transform:translateY(-12px);pointer-events:none}
.nibbly-shell.loading-fadeout .nibbly-subtitle,
.nibbly-shell.loading-fadeout .nibbly-loading,
.nibbly-shell.loading-fadeout .boom-btn{opacity:0;pointer-events:none}

#nibblyApp{display:none}
#nibblyApp.ready{display:block;
animation:nibFadeIn .6s ease .25s both}
@keyframes nibFadeIn{from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:none}}

.nibbly-shell.app-ready .nibbly-title,
.nibbly-shell.app-ready .nibbly-subtitle,
.nibbly-shell.app-ready .nibbly-loading,
.nibbly-shell.app-ready .boom-btn{display:none}


@media (min-width:900px){body{padding:48px}
.nibbly-shell{max-width:960px}
.nibbly-subtitle{margin-bottom:36px;

.nibbly-loading{padding:32px;
line-height:1.7}
.nibbly-loading::after{margin-left:14px;
border-width:3px}}

<script>(function(){
'use strict';


let globalSyntaxError=null;

window.addEventListener('error',function(e){
if(e.target&&(e.target.tagName==='SCRIPT'||e.target.tagName==='LINK')){
let src=e.target.src||e.target.href||'unknown';
src=src.split('/').pop().split('?')[0];
globalSyntaxError=`Fallo de carga en recurso: ${src}`;
return;
}
if(e.message){
let fileInfo=e.filename?e.filename.split('/').pop().split('?')[0]:'inline';
globalSyntaxError=`[${fileInfo}:${e.lineno}] ${e.message}`;
}
},true);

window.addEventListener('unhandledrejection',function(e){
if(e.reason){
let msg=e.reason.message||e.reason;
globalSyntaxError=`Promesa rechazada: ${msg}`;
}
});

function getString(k){

if(langEs&&langEs[k])return langEs[k];

function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

function setErrorState(on){
document.documentElement.classList.toggle('error-state',!!on);
}

function buildErrorReport(kind,mainText,detail,extra){
const lines=[];
lines.push('═══════════════════════════════════════════════');
lines.push('  NIBBLY ERROR REPORT');
lines.push('═══════════════════════════════════════════════');
lines.push('');
lines.push('Kind:       '+kind);
lines.push('Time:       '+new Date().toISOString());
lines.push('AppVersion: '+APP_VERSION);
lines.push('URL:        '+location.href);
lines.push('Protocol:   '+location.protocol);
lines.push('UserAgent:  '+navigator.userAgent);
lines.push('');
if(mainText){
lines.push('── Main message ─────────────────────────────────');
lines.push(mainText);
lines.push('');
}
if(detail&&detail.length){
lines.push('── Missing files ('+detail.length+') ─────────────────────────');
detail.forEach(p=>lines.push('  • '+p));
lines.push('');
}
if(extra){
lines.push('── Additional info ─────────────────────────────');
lines.push(extra);
lines.push('');
}
if(globalSyntaxError){
lines.push('── Syntax/Runtime Error ────────────────────────');
lines.push('  '+globalSyntaxError);
lines.push('');
}
lines.push('── Registered modules ──────────────────────────');
const mods=(window.NibblyModules&&Object.keys(window.NibblyModules))||[];
lines.push('  ['+mods.length+'] '+(mods.join(', ')||'(none)'));
lines.push('');
lines.push('── Global state ────────────────────────────────');
lines.push('  NibblyApp:     '+!!window.NibblyApp);
lines.push('  NibblyEffects: '+!!window.NibblyEffects);
lines.push('  NibblyStrings: '+!!window.NibblyStrings);
lines.push('  NibblyEs:      '+!!window.NibblyEs);
lines.push('  NibblyLangs:   '+!!window.NibblyLangs);
lines.push('  NibblyIcons:   '+!!window.NibblyIcons);
lines.push('');
lines.push('── Cache API ───────────────────────────────────');
lines.push('  (loading…)');
lines.push('');
lines.push('═══════════════════════════════════════════════');
return lines.join('\n');
}

async function copyToClipboard(text){
try{
if(navigator.clipboard&&window.isSecureContext){
await navigator.clipboard.writeText(text);
return true;
}
}catch(_){}
try{
const ta=document.createElement('textarea');
ta.value=text;
ta.setAttribute('readonly','');
ta.style.position='fixed';
ta.style.top='-9999px';
ta.style.opacity='0';
document.body.appendChild(ta);
ta.select();
ta.setSelectionRange(0,text.length);
const ok=document.execCommand('copy');
ta.remove();
return ok;
}catch(_){return false;}
}

function bindCopyErrorBtn(){
const btn=document.getElementById('nibCopyErrorBtn');
if(!btn||btn.dataset.bound==='1')return;
btn.dataset.bound='1';
btn.addEventListener('click',async()=>{
let report=currentErrorReport;
if('caches'in window){
try{
const keys=await caches.keys();
report=report.replace('(loading…)',
'  ['+keys.length+'] '+(keys.join(', ')||'(none)'));
}catch(_){
report=report.replace('(loading…)','  (error reading caches)');
}
}else{
report=report.replace('(loading…)','  (Cache API not available)');
}
const ok=await copyToClipboard(report);
const origHTML=btn.innerHTML;
btn.innerHTML=ok
?iconOrEmoji('check','✅',16)+' '+escapeHTML(getString('error.copied'))
:'<span aria-hidden="true">❌</span> '+escapeHTML(getString('error.copyFailed'));
btn.classList.toggle('copied',ok);
setTimeout(()=>{
btn.innerHTML=origHTML;
btn.classList.remove('copied');
},1500);
});
}

function bindWipeCacheBtn(){
const btn=document.getElementById('nibWipeCacheBtn');
if(!btn||btn.dataset.bound==='1')return;
btn.dataset.bound='1';
btn.addEventListener('click',async()=>{
btn.disabled=true;
const origHTML=btn.innerHTML;
btn.innerHTML='<span aria-hidden="true">⏳</span> '+
escapeHTML(getString('error.wiping'));
try{
if('caches'in window){
const keys=await caches.keys();
await Promise.all(keys.map(k=>caches.delete(k)));
console.info('[Nibbly] 🧹 Caches cleared:',keys.length);
}
}catch(err){
console.warn('[Nibbly] Cache wipe error:',err);
}
try{
if('serviceWorker'in navigator){
const regs=await navigator.serviceWorker.getRegistrations();
await Promise.all(regs.map(r=>r.unregister()));
console.info('[Nibbly] 🧹 SW unregistered:',regs.length);
}
}catch(err){
console.warn('[Nibbly] SW unregister error:',err);
}
btn.classList.add('done');
btn.innerHTML=iconOrEmoji('check','✅',16)+' '+
escapeHTML(getString('error.wiped'));
setTimeout(()=>{
try{
const url=new URL(location.href);
url.searchParams.set('bust',Date.now().toString());
location.replace(url.toString());
}catch(_){
location.reload();
}
},400);
void origHTML;
});
}

function bindBoomBtn(){

bootCompleted=true;

}

function applyShellLang(){
let preferredLang='en';
try{
const raw=localStorage.getItem(SETTINGS_KEY);
if(raw){
const s=JSON.parse(raw);
if(s&&s.lang==='es'&&langEs)preferredLang='es';
}
}catch(_){}

const dict=(preferredLang==='es'&&langEs)?langEs:langStrings;
if(dict&&subtitleEl&&dict['app.subtitle']){
subtitleEl.textContent=dict['app.subtitle'];
}
console.info('[Nibbly shell] subtitle lang =',preferredLang,
'(langEs='+!!langEs+')');
}


function shouldPlayLoadingMusic(){
try{
const raw=localStorage.getItem(SETTINGS_KEY);
if(!raw)return false;
const s=JSON.parse(raw);
return!!s.music;
}catch(_){return false;}
}

function startLoadingMusic(){
if(loadingAudio)return;
if(!shouldPlayLoadingMusic()){
console.info('[Nibbly loading] music disabled — silent load');
return;
}
try{
loadingAudio=new Audio(LOADING_MUSIC_PATH);
loadingAudio.loop=true;
loadingAudio.volume=0;
loadingAudio.preload='auto';

loadingAudio.addEventListener('error',()=>{
console.info('[Nibbly loading] music not available:',LOADING_MUSIC_PATH);
loadingAudio=null;
});

const p=loadingAudio.play();
if(p&&typeof p.catch==='function'){
p.catch(()=>{
const resume=()=>{
document.removeEventListener('pointerdown',resume);
document.removeEventListener('keydown',resume);
document.removeEventListener('touchstart',resume);
if(loadingAudio&&!loadingFadeOut){
loadingAudio.play().catch(()=>{});
}
};
document.addEventListener('pointerdown',resume,{once:true,passive:true});
document.addEventListener('keydown',resume,{once:true});
document.addEventListener('touchstart',resume,{once:true,passive:true});
});
}

const t0=performance.now();
const fadeIn=setInterval(()=>{
if(!loadingAudio||loadingFadeOut){clearInterval(fadeIn);return;}
const t=Math.min(1,(performance.now()-t0)/800);
loadingAudio.volume=0.8*t;
if(t>=1)clearInterval(fadeIn);
},30);

console.info('[Nibbly loading] ▶ The Great Nibbly Revelation');
}catch(_){}
}

function fadeOutLoadingMusic(){
if(!loadingAudio||loadingFadeOut)return Promise.resolve();
loadingFadeOut=true;
console.info('[Nibbly loading] ⏹ fading out loading music');

return new Promise(resolve=>{
const startVol=loadingAudio.volume;
const t0=performance.now();
const fade=setInterval(()=>{
if(!loadingAudio){
clearInterval(fade);
resolve();
return;
}
const elapsed=performance.now()-t0;
const t=Math.min(1,elapsed/FADE_OUT_MS);
loadingAudio.volume=Math.max(0,startVol*(1-t));
if(t>=1){
clearInterval(fade);
try{
loadingAudio.pause();
loadingAudio.src='';
}catch(_){}
loadingAudio=null;
resolve();
}
},FADE_STEP_MS);
});
}

function killLoadingMusic(){
if(!loadingAudio)return;
loadingFadeOut=true;
try{
loadingAudio.pause();
loadingAudio.src='';
}catch(_){}
loadingAudio=null;
}


function loadScript(src,timeout){
timeout=timeout||PER_FILE_TIMEOUT;
return new Promise(resolve=>{
let settled=false;
const s=document.createElement('script');
s.src=src;s.async=true;
const done=ok=>{if(!settled){settled=true;resolve(ok);}};
s.onload=()=>done(true);
s.onerror=()=>done(false);
document.head.appendChild(s);
setTimeout(()=>done(false),timeout);
});
}


function loadCSS(href,timeout){
timeout=timeout||PER_FILE_TIMEOUT;
return new Promise(resolve=>{
const existing=document.querySelector(
'link[rel="stylesheet"][href="'+CSS.escape(href)+'"]'
);
if(existing){
if(existing.dataset.nibLoaded==='1'){
return resolve(true);
}
if(existing.dataset.nibFailed==='1'){
existing.remove();
}else{
let settled=false;
const done=ok=>{
if(settled)return;
settled=true;
clearTimeout(timer);
if(ok)existing.dataset.nibLoaded='1';
resolve(ok);
};
const timer=setTimeout(()=>{
if(cssIsAppliedInSheets(href)){
existing.dataset.nibLoaded='1';
done(true);
}else{
done(false);
}
},timeout);
existing.addEventListener('load',()=>done(true),{once:true});
existing.addEventListener('error',()=>{
existing.dataset.nibFailed='1';
done(false);
},{once:true});
return;
}
}

let settled=false;
const l=document.createElement('link');
l.rel='stylesheet';
l.href=href;
const done=ok=>{
if(settled)return;
settled=true;
clearTimeout(timer);
if(ok)l.dataset.nibLoaded='1';
else l.dataset.nibFailed='1';
resolve(ok);
};
l.onload=()=>done(true);
l.onerror=()=>done(false);
document.head.appendChild(l);
const timer=setTimeout(()=>{
if(cssIsAppliedInSheets(href)){
l.dataset.nibLoaded='1';
done(true);
}else{
done(false);
}
},timeout);
});
}

function loadAsset(path,type,timeout){
return new Promise(resolve=>{
let settled=false;
const done=ok=>{if(!settled){settled=true;resolve(ok);}};
const timer=setTimeout(()=>done(false),timeout);
try{
if(type==='image'){
const img=new Image();
img.onload=()=>{clearTimeout(timer);done(true);};
img.onerror=()=>{clearTimeout(timer);done(false);};
img.src=path;
}else if(type==='audio'){
const a=new Audio();
a.preload='metadata';
a.onloadedmetadata=()=>{clearTimeout(timer);done(true);};
a.onerror=()=>{clearTimeout(timer);done(false);};
a.src=path;
}else{done(false);}
}catch(_){clearTimeout(timer);done(false);}
});
}


function verifyJs(path){
const filename=path.split('/').pop().split('?')[0].replace(/\.js$/,'');

if(filename==='icons'){
return!!(window.NibblyModules&&
window.NibblyModules.icons&&
typeof window.NibblyModules.icons.init==='function');
}

if(path.indexOf('/langs/')!==-1){
if(filename==='strings'){
if(window.NibblyStrings&&
typeof window.NibblyStrings==='object'&&
Object.keys(window.NibblyStrings).length>10)return true;
if(window.NibblyLangs&&window.NibblyLangs.en&&
typeof window.NibblyLangs.en==='object'&&
Object.keys(window.NibblyLangs.en).length>10)return true;
return false;
}
if(filename==='es'){
if(window.NibblyEs&&
typeof window.NibblyEs==='object'&&
Object.keys(window.NibblyEs).length>10)return true;
if(window.NibblyLangs&&window.NibblyLangs.es&&
typeof window.NibblyLangs.es==='object'&&
Object.keys(window.NibblyLangs.es).length>10)return true;
return false;
}
return false;
}

if(filename==='config'){
return!!(window.NibblyApp&&typeof window.NibblyApp.init==='function');
}

if(filename==='main'){
const mods=window.NibblyModules||{};
const required=['numbers','textconv','bits','power','media','calc','ciphers'];
const okCount=required.filter(m=>
mods[m]&&typeof mods[m].init==='function'
).length;
console.info('[Nibbly verify] main.js →',okCount+'/'+required.length,'submodules');
return okCount===required.length;
}

const m1=window.NibblyModules&&window.NibblyModules[filename];
if(m1&&typeof m1.init==='function')return true;

const cap=filename.charAt(0).toUpperCase()+filename.slice(1);
const candidates=[
'Nibbly'+cap,'Nibbly'+cap+'s',
'Nibbly'+cap+'Module','Nibbly'+cap+'Tab',
cap,cap+'s'
];
for(let i=0;i<candidates.length;i++){
const m=window[candidates[i]];
if(!m)continue;
if(typeof m.init==='function')return true;
if(typeof m==='function')return true;
if(typeof m.render==='function')return true;
}
return false;
}


function cssIsAppliedInSheets(href){
const target=href.split('?')[0].toLowerCase().replace(/^\.?\//,'');
try{
for(let i=0;i<document.styleSheets.length;i++){
const sheet=document.styleSheets[i];
if(!sheet.href)continue;
if(sheet.href.toLowerCase().indexOf(target)===-1)continue;
try{
if(sheet.cssRules&&sheet.cssRules.length>0)return true;
}catch(_){
return true;
}
}
}catch(_){}
return false;
}


function verifyCss(path){
const href=path.split('?')[0];
const target=href.toLowerCase().replace(/^\.?\//,'');

if(cssIsAppliedInSheets(path))return true;

const links=document.querySelectorAll('link[rel="stylesheet"]');
for(let i=0;i<links.length;i++){
const l=links[i];
const raw=(l.getAttribute('href')||'').toLowerCase();
if(raw.indexOf(target)===-1)continue;
if(l.dataset.nibLoaded==='1')return true;
if(!l.dataset.nibFailed&&cssIsAppliedInSheets(path))return true;
}
return false;
}

function deleteModule(path){
const filename=path.split('/').pop().split('?')[0].replace(/\.js$/,'');
if(path.indexOf('/langs/')!==-1){
if(filename==='strings'){
delete window.NibblyStrings;
if(window.NibblyLangs)delete window.NibblyLangs.en;
}
if(filename==='es'){
delete window.NibblyEs;
if(window.NibblyLangs)delete window.NibblyLangs.es;
}
return;
}
if(filename==='config'){delete window.NibblyApp;return;}

if(filename==='main'){
if(window.NibblyModules){
['numbers','textconv','bits','power','media','calc','ciphers']
.forEach(m=>{delete window.NibblyModules[m];});
}
return;
}

if(window.NibblyModules)delete window.NibblyModules[filename];
const cap=filename.charAt(0).toUpperCase()+filename.slice(1);
['Nibbly'+cap,'Nibbly'+cap+'s','Nibbly'+cap+'Module',
'Nibbly'+cap+'Tab',cap,cap+'s'
].forEach(n=>{if(window[n])delete window[n];});
}

function removeCssLink(path){
const target=path.split('?')[0].toLowerCase().replace(/^\.?\//,'');
document.querySelectorAll('link[rel="stylesheet"]').forEach(l=>{
const raw=(l.getAttribute('href')||'').toLowerCase();
if(raw.indexOf(target)!==-1)l.remove();
});
}


async function loadAndVerifySilent(kind,path,timeout,optional,retry){
const isJs=kind==='js';
const wait=isJs?VERIFY_DELAY_MS:VERIFY_DELAY_CSS;

async function attempt(useBust){
const url=useBust?bustUrl(path):versionUrl(path);
const loaded=isJs
?await loadScript(url,timeout)
:await loadCSS(url,timeout);
if(!loaded)return false;
if(wait>0)await sleep(wait);
return isJs?verifyJs(path):verifyCss(path);
}

let ok=await attempt(false);
if(!ok&&(!optional||retry)){
console.warn('[Nibbly] verify failed:',path,'→ retry');
if(isJs){
deleteModule(path);
ok=await attempt(true);
}else{

const href=path.split('?')[0];
const existing=document.querySelector(
'link[rel="stylesheet"][href="'+CSS.escape(href)+'"]'
);
const failed=existing&&existing.dataset.nibFailed==='1';
if(!existing||failed){
if(failed)existing.remove();
ok=await attempt(true);
}else{
await sleep(1500);
ok=verifyCss(path)||cssIsAppliedInSheets(path);
}
}
}
return ok;
}

async function doRescan(){
if(rescanning||failedFiles.length===0)return;
rescanning=true;

const toRetry=failedFiles.slice();
failedFiles=[];
errorEl.classList.remove('show');
errorEl.innerHTML='';
currentErrorReport='';
loadingEl.style.display='';
setErrorState(false);

toRetry.forEach(f=>{
if(f.type==='js')deleteModule(f.path);
else removeCssLink(f.path);
});

for(let i=0;i<toRetry.length;i++){
const f=toRetry[i];
const idx=i+1,total=toRetry.length;
updateLoading('Rescanning ('+idx+'/'+total+')\n'+f.path);

let ok=false;
if(f.type==='js'){
ok=await loadScript(bustUrl(f.path),PER_FILE_TIMEOUT);
if(ok){
updateLoading('Rescanning ('+idx+'/'+total+')\nVerifying '+f.path+'…');
await sleep(VERIFY_DELAY_MS);
ok=verifyJs(f.path);
}
}else{
ok=await loadCSS(bustUrl(f.path),PER_FILE_TIMEOUT);
if(ok){
await sleep(VERIFY_DELAY_CSS);
ok=verifyCss(f.path);
}
}
if(!ok)failedFiles.push(f);
}

rescanning=false;
if(failedFiles.length>0){
showMissingNo(failedFiles.map(f=>f.path),'After rescan');
return;
}

langStrings=window.NibblyStrings||
(window.NibblyLangs&&window.NibblyLangs.en)||null;
langEs=window.NibblyEs||
(window.NibblyLangs&&window.NibblyLangs.es)||null;

applyShellLang();
updateLoading(getString('app.starting'));
await tryInit();
}


async function tryInit(){
applyShellLang();

const ctx={
strings:langStrings,
es:langEs,
hasSpanish:!!langEs,
fallback:FALLBACK,
getString:getString,
setLanguage:(code)=>{
currentLang=(code==='es'&&langEs)?'es':'en';
}
};
try{
let initFn=null;
if(window.NibblyApp&&typeof window.NibblyApp.init==='function'){
initFn=window.NibblyApp.init.bind(window.NibblyApp);
}else if(window.Nibbly&&typeof window.Nibbly.init==='function'){
initFn=window.Nibbly.init.bind(window.Nibbly);
}
if(!initFn){
console.error('[Nibbly] No init function found.');
showMissingNo([],'No init function found in loaded modules');
return;
}

await Promise.race([
Promise.resolve(initFn(appEl,ctx)),
new Promise((_,rej)=>
setTimeout(()=>rej(new Error('init-timeout')),INIT_TIMEOUT_MS))
]);

bootCompleted=true;
clearTimeout(bootWatchdog);
setErrorState(false);
hideBoomBtn();

updateLoading(getString('app.starting'));

const musicFade=fadeOutLoadingMusic();
shellEl.classList.add('loading-fadeout');

setTimeout(()=>{
loadingEl.style.display='none';
shellEl.classList.add('app-ready');
shellEl.classList.remove('loading-fadeout');
appEl.classList.add('ready');
},400);

await musicFade;

}catch(err){
console.error('[Nibbly] Init failed:',err);
const isTimeout=err&&err.message==='init-timeout';
const mainText=getString(isTimeout?'error.initTimeout':'error.initFail');
currentErrorReport=buildErrorReport(
isTimeout?'InitTimeout':'InitFail',
mainText,null,(err&&err.stack)||(err&&err.message)||String(err)
);
hideBoomBtn();
setErrorState(true);

let errorDisplay='';
if(globalSyntaxError){
errorDisplay='<div class="error-detail" style="color:#fff; background:rgba(255,0,0,0.2); padding:8px; border-radius:8px; margin-top:10px;">'+
escapeHTML(globalSyntaxError)+'</div>';
}

errorEl.innerHTML=escapeHTML(mainText)+
'<span class="error-detail">'+
escapeHTML(err.message||String(err))+'</span>'+
errorDisplay+
'<div class="error-actions">'+
'<button class="wipe-cache-btn" id="nibWipeCacheBtn" type="button">'+
iconOrEmoji('trash','🧹',16)+' '+escapeHTML(getString('error.wipeCache'))+
'</button>'+
'<button class="copy-error-btn" id="nibCopyErrorBtn" type="button">'+
iconOrEmoji('copy','📋',16)+' '+escapeHTML(getString('error.copyReport'))+
'</button>'+
'</div>';
errorEl.classList.add('show');
bindCopyErrorBtn();
bindWipeCacheBtn();
if(loadingEl)loadingEl.style.display='none';
}
}

async function boot(){
bindBoomBtn();

updateLoading('Loading Nibbly…');

const allResults=[];

for(const phase of PHASES){
let completed=0;
const total=phase.files.length;
updateLoading(phase.label+' (0/'+total+')');

const phaseResults=await Promise.all(
phase.files.map(async(spec)=>{
const timeout=spec.timeout||
(spec.optional?OPTIONAL_TIMEOUT:PER_FILE_TIMEOUT);
const optional=!!spec.optional;
const retry=!!spec.retry;
const result={file:spec,jsOk:true,cssOk:true,assetOk:true};

if(spec.js){
result.jsOk=await loadAndVerifySilent(
'js',spec.js,timeout,optional,retry
);
}
if(spec.css){
result.cssOk=await loadAndVerifySilent(
'css',spec.css,timeout,optional,false
);
}
if(spec.asset){
result.assetOk=await loadAsset(spec.asset,spec.assetType,timeout);
if(!result.assetOk&&spec.informational){
console.info('[Nibbly] (info) asset missing:',spec.asset);
}
}

completed++;
updateLoading(phase.label+' ('+completed+'/'+total+')');
return result;
})
);

if(phase.key==='languages'){
const sRes=phaseResults.find(r=>r.file.js&&r.file.js.indexOf('strings.js')!==-1);
const eRes=phaseResults.find(r=>r.file.js&&r.file.js.indexOf('es.js')!==-1);
if(sRes&&sRes.jsOk){
langStrings=window.NibblyStrings||
(window.NibblyLangs&&window.NibblyLangs.en)||null;
applyShellLang();
}
if(eRes&&eRes.jsOk){
langEs=window.NibblyEs||
(window.NibblyLangs&&window.NibblyLangs.es)||null;
applyShellLang();
}
}

if(phase.key==='icons'){
upgradeBoomIcon();
}

allResults.push(...phaseResults);

if(phase.key==='config')startLoadingMusic();
}

if(bootCompleted)return;

const required=allResults.filter(r=>!r.file.optional);
const loadedJs=required.filter(r=>r.jsOk).length;

failedFiles=[];
required.forEach(r=>{
if(r.file.js&&!r.jsOk)failedFiles.push({path:r.file.js,type:'js'});
if(r.file.css&&!r.cssOk)failedFiles.push({path:r.file.css,type:'css'});
});

const expansionLoaded=allResults
.filter(r=>r.file.optional&&(r.jsOk||r.assetOk)&&(r.file.js||r.file.asset))
.map(r=>r.file.js||r.file.asset);
if(expansionLoaded.length>0){
console.info('[Nibbly] ✅ Expansions:',expansionLoaded);
}
if(langEs){
console.info('[Nibbly] ✅ Spanish ('+Object.keys(langEs).length+' keys)');
}else{
console.info('[Nibbly] ⚠ Spanish pack not loaded');
}

if(loadedJs===0){
showBrick('No JS modules loaded at all');
return;
}
if(failedFiles.length>0){
showMissingNo(failedFiles.map(f=>f.path),'After full boot');
return;
}

updateLoading(getString('app.starting'));
await tryInit();
}


if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',boot,{once:true});
}else{
boot();
}
})();</script>
